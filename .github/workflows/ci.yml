name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
      - name: Lint and format
        run: biome ci .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify zero dependencies
        run: |
          node -e "
            const pkg = require('./package.json');
            if (pkg.dependencies && Object.keys(pkg.dependencies).length > 0) {
              console.error('grainulation: found runtime dependencies:', pkg.dependencies);
              process.exit(1);
            }
            console.log('Zero dependencies verified');
          "
      - name: Run tests
        run: npm test
      - name: CLI help check
        run: node bin/grainulation.js --help

  package-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check package size (< 512KB)
        run: |
          SIZE=$(npm pack --dry-run --json 2>/dev/null | node -e "
            let buf = '';
            process.stdin.on('data', d => buf += d);
            process.stdin.on('end', () => {
              const info = JSON.parse(buf);
              const bytes = Array.isArray(info) ? info[0].size : info.size;
              console.log(bytes);
            });
          ")
          echo "Package size: ${SIZE} bytes"
          LIMIT=$((512 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Package size ${SIZE} bytes exceeds 512KB limit"
            exit 1
          fi
          echo "Within 512KB limit"
