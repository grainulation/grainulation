name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
        with:
          version: '2.4.8'
      - name: Lint and format
        run: biome ci .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify zero third-party dependencies
        run: |
          # Internal @grainulation/* deps are allowed; any other dep fails.
          foreign=$(node -e "
            const d = require('./package.json').dependencies || {};
            const bad = Object.keys(d).filter(n => !n.startsWith('@grainulation/'));
            console.log(bad.join(','));
          ")
          if [ -n "$foreign" ]; then
            echo "ERROR: package.json has third-party dependencies: $foreign"
            echo "Only @grainulation/* internal deps are permitted."
            exit 1
          fi
      - name: Run tests
        run: pnpm test
      - name: CLI help check
        run: node bin/grainulation.js --help
      - name: Doctor check
        run: node bin/grainulation.js doctor

  package-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check package size (< 512KB)
        run: |
          SIZE=$(npm pack --dry-run --json 2>/dev/null | node -e "
            let buf = '';
            process.stdin.on('data', d => buf += d);
            process.stdin.on('end', () => {
              const info = JSON.parse(buf);
              const bytes = Array.isArray(info) ? info[0].size : info.size;
              console.log(bytes);
            });
          ")
          echo "Package size: ${SIZE} bytes"
          LIMIT=$((512 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Package size ${SIZE} bytes exceeds 512KB limit"
            exit 1
          fi
          echo "Within 512KB limit"

  seo-regression-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SEO regression check
        run: bash scripts/seo-check.sh

  static-site:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build organization site without legacy asset generation
        run: node scripts/build-site.mjs
      - name: Check unchanged authored homepage
        run: cmp site/index.html dist/site/index.html
