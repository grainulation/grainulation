name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      lib: ${{ steps.filter.outputs.lib }}
      test: ${{ steps.filter.outputs.test }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lib:
              - 'lib/**'
              - 'bin/**'
              - 'package.json'
            test:
              - 'test/**'
            site:
              - 'site/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
      - name: Lint and format
        run: biome ci .

  test:
    needs: detect
    if: needs.detect.outputs.lib == 'true' || needs.detect.outputs.test == 'true' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify zero third-party dependencies
        run: |
          # Internal @grainulation/* deps are allowed; any other dep fails.
          foreign=$(node -e "
            const d = require('./package.json').dependencies || {};
            const bad = Object.keys(d).filter(n => !n.startsWith('@grainulation/'));
            console.log(bad.join(','));
          ")
          if [ -n "$foreign" ]; then
            echo "ERROR: package.json has third-party dependencies: $foreign"
            echo "Only @grainulation/* internal deps are permitted."
            exit 1
          fi
      - name: Run tests
        run: pnpm test
      - name: CLI help check
        run: node bin/grainulation.js --help
      - name: Doctor check
        run: node bin/grainulation.js doctor

  package-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check package size (< 512KB)
        run: |
          SIZE=$(npm pack --dry-run --json 2>/dev/null | node -e "
            let buf = '';
            process.stdin.on('data', d => buf += d);
            process.stdin.on('end', () => {
              const info = JSON.parse(buf);
              const bytes = Array.isArray(info) ? info[0].size : info.size;
              console.log(bytes);
            });
          ")
          echo "Package size: ${SIZE} bytes"
          LIMIT=$((512 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Package size ${SIZE} bytes exceeds 512KB limit"
            exit 1
          fi
          echo "Within 512KB limit"
